# Plan and apply against AWS through GitHub OIDC (no stored AWS keys).
#
# OFF until you finish the bootstrap step and set, in repo Settings:
#   Variables: AWS_DEPLOY_ENABLED=true, AWS_REGION, TF_STATE_BUCKET
#   Secrets:   AWS_PLAN_ROLE_ARN, AWS_APPLY_ROLE_ARN
#   Optional:  variable CREATE_SANDBOX_ACCOUNT=true + secret SANDBOX_ACCOUNT_EMAIL
#   Environment "production" with yourself as a required reviewer.
# Role ARNs are stored as secrets only so the account ID is masked in public logs.
name: terraform

on:
  pull_request:
    paths: ["live/**", "modules/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["live/**", "modules/**", ".github/workflows/terraform.yml"]

permissions:
  contents: read

concurrency:
  group: terraform-live
  cancel-in-progress: false

env:
  TF_VERSION: 1.16.6
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Same inputs as your local terraform.tfvars, so CI and laptop agree.
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_create_sandbox_account: ${{ vars.CREATE_SANDBOX_ACCOUNT || 'false' }}
  TF_VAR_sandbox_account_email: ${{ secrets.SANDBOX_ACCOUNT_EMAIL }}

jobs:
  plan:
    name: plan (pull request, read-only role)
    if: github.event_name == 'pull_request' && vars.AWS_DEPLOY_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # lets the job request a GitHub OIDC token
    defaults:
      run:
        working-directory: live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-plan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Mask the account ID everywhere in this job's logs
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"

      - name: terraform init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"

      - name: terraform plan
        run: terraform plan -lock-timeout=5m -no-color -out=tfplan

  apply:
    name: apply (main, protected environment)
    if: github.event_name == 'push' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production # the apply role trusts ONLY this environment
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-apply-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Mask the account ID everywhere in this job's logs
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"

      - name: terraform init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"

      - name: terraform plan
        run: terraform plan -lock-timeout=5m -no-color -out=tfplan

      - name: terraform apply
        run: terraform apply -lock-timeout=5m -no-color tfplan
